name: Build IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "切换到: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Unzip Project
        run: |
          if [ -f app.zip ]; then
            echo "找到 app.zip，正在解压..."
            unzip -o app.zip -d .
            echo "解压完成，当前目录:"
            ls -la
          else
            echo "未找到 app.zip，跳过解压"
          fi

      - name: Locate Project
        id: locate
        run: |
          echo "=== 搜索 project.yml ==="
          find . -name "project.yml" -not -path "*/.git/*" 2>/dev/null
          PROJECT_DIR=$(find . -name "project.yml" -not -path "*/.git/*" 2>/dev/null | head -1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "未找到 project.yml，所有文件:"
            find . -not -path "*/.git/*" -type f | head -50
            exit 1
          fi
          echo "项目目录: $PROJECT_DIR"
          echo "该目录内容:"
          ls -la "$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Generate Xcode Project
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          echo "在 $(pwd) 执行 xcodegen"
          xcodegen generate

      - name: Build
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          xcodebuild \
            -project Ledger.xcodeproj \
            -scheme Ledger \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ledger.app Payload/
          zip -r Ledger.ipa Payload
          ls -lh Ledger.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Ledger.ipa
          path: ${{ steps.locate.outputs.project_dir }}/Ledger.ipa
