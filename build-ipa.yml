name: 编译 Ledger IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 解压 app.zip
        run: |
          unzip -o app.zip -d extracted
          ls -la extracted

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 项目
        run: |
          cd extracted/ledger-app
          xcodegen generate
          ls -la

      - name: 编译（不签名）
        run: |
          cd extracted/ledger-app
          xcodebuild \
            -project Ledger.xcodeproj \
            -scheme Ledger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: 打包 IPA
        run: |
          cd extracted/ledger-app
          APP_PATH=$(find build/Build/Products -name "Ledger.app" -type d | head -1)
          echo "App path: $APP_PATH"
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          zip -r Ledger.ipa Payload
          ls -lh Ledger.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: Ledger.ipa
          path: extracted/ledger-app/Ledger.ipa
